<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rohith Sheregar — Building Intelligent Systems</title>
  <meta name="description" content="Rohith Sheregar — Software Development Engineer & AI/ML Engineer. Building deployable software, intelligent systems, and scalable architecture.">
  
  <!-- Premium Typography: Cinzel for classical serif wordmark & Inter for modern tagline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Three.js (r128) via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-dark: #020409;
      --text-silver: #f1f5f9;
      --text-silver-muted: #94a3b8;
      --text-violet: #818cf8;
      --accent-gold: #f59e0b;
      --accent-amber: #fef08a;
      --accent-blue: #38bdf8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-silver);
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    /* WebGL Canvas */
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* Cinematic Vignette */
    .cinematic-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(circle at 50% 40%, transparent 45%, rgba(1, 2, 6, 0.6) 80%, rgba(1, 2, 6, 0.95) 100%);
    }

    /* Horizon Glow Gradient */
    .horizon-glow {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 60%;
      height: 45%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(ellipse at 80% 85%, rgba(245, 158, 11, 0.12) 0%, rgba(234, 88, 12, 0.06) 40%, transparent 75%);
    }

    /* Hero Typography Layer */
    .hero-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 7vw;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-content {
      max-width: 820px;
      opacity: 0;
      transform: translateY(20px);
      animation: heroFadeIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    @keyframes heroFadeIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Unified Wordmark: R with subtle orbit + OHITH SHEREGAR */
    .wordmark-row {
      display: flex;
      align-items: baseline;
      gap: 0;
      margin-bottom: 1.4rem;
    }

    /* Custom Metallic Silver R with integrated Orbit */
    .metallic-r-wrap {
      position: relative;
      width: clamp(52px, 5.8vw, 84px);
      height: clamp(62px, 6.8vw, 98px);
      flex-shrink: 0;
      margin-right: clamp(2px, 0.3vw, 6px);
      display: inline-block;
      vertical-align: baseline;
      transform: translateY(clamp(6px, 0.8vw, 12px));
    }

    .metallic-r-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 2px 14px rgba(129, 140, 248, 0.3));
    }

    /* Wordmark Text */
    .wordmark-text {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.8rem, 5.8vw, 5.2rem);
      font-weight: 600;
      letter-spacing: 0.16em;
      line-height: 1;
      white-space: nowrap;
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 25%, #cbd5e1 50%, #a5b4fc 75%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.85));
    }

    /* Enriched, Highly-Readable Tagline */
    .tagline-text {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.95rem, 1.4vw, 1.25rem);
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      line-height: 1.6;
      margin-left: 4px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
    }

    .tagline-silver {
      color: #f1f5f9;
    }

    .tagline-violet {
      color: #818cf8;
      text-shadow: 0 0 16px rgba(129, 140, 248, 0.45);
    }

    /* Navigation link to GitHub Profile */
    .back-nav {
      position: absolute;
      top: 32px;
      left: 7vw;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      border-radius: 9999px;
      background: rgba(10, 16, 30, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      color: var(--text-silver-muted);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      opacity: 0;
      animation: heroFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
    }

    .back-nav:hover {
      background: rgba(15, 23, 42, 0.85);
      border-color: rgba(129, 140, 248, 0.4);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 14px rgba(129, 140, 248, 0.3);
    }

    .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #818cf8;
      box-shadow: 0 0 8px #818cf8;
    }

    /* Subtle Status Indicator */
    .status-pill {
      position: absolute;
      top: 32px;
      right: 7vw;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 9999px;
      background: rgba(10, 16, 30, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: #fef08a;
      font-size: 0.74rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0;
      animation: heroFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }

    .status-ping {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    @media (max-width: 900px) {
      .hero-container {
        padding: 0 6vw;
        justify-content: flex-end;
        padding-bottom: 16vh;
      }
      .wordmark-row {
        flex-wrap: wrap;
      }
      .wordmark-text {
        font-size: clamp(2.2rem, 8vw, 3.4rem);
      }
      .tagline-text {
        letter-spacing: 0.18em;
        font-size: 0.85rem;
      }
      .back-nav, .status-pill {
        top: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, .hero-content, .back-nav, .status-pill {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Return to Profile Navigation -->
  <a href="https://github.com/rohithsheregar" class="back-nav" id="github-link">
    <span class="nav-dot"></span>

  </a>

  <!-- Realtime System Status -->
  <div class="status-pill">
    <span class="status-ping"></span>

  <!-- Three.js Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Cinematic Vignette & Atmospheric Glow -->
  <div class="cinematic-vignette"></div>
  <div class="horizon-glow"></div>

  <!-- Hero Typography Overlay -->
  <div class="hero-container" id="hero-container">
    <div class="hero-content">
      
      <!-- Unified Wordmark: R with subtle orbit + OHITH SHEREGAR -->
      <div class="wordmark-row">
        <!-- Integrated Sculpted Metallic R -->
        <div class="metallic-r-wrap">
          <svg class="metallic-r-svg" viewBox="0 0 76 86" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="rChromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="25%" stop-color="#e2e8f0"/>
                <stop offset="48%" stop-color="#94a3b8"/>
                <stop offset="68%" stop-color="#ffffff"/>
                <stop offset="85%" stop-color="#cbd5e1"/>
                <stop offset="100%" stop-color="#64748b"/>
              </linearGradient>
              <linearGradient id="rBevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                <stop offset="50%" stop-color="#64748b" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
              </linearGradient>
              <linearGradient id="rOrbitGold" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>

              </linearGradient>
              <filter id="rGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            
            <!-- Metallic R Chrome Body -->
            <path d="M 4,4 L 32,4 C 50,4 62,12 62,28 C 62,40 54,48 44,51 L 64,82 L 46,82 L 28,53 L 18,53 L 18,82 L 4,82 Z M 18,16 L 18,41 L 32,41 C 42,41 48,35 48,28 C 48,21 42,16 32,16 Z" fill="url(#rChromeGrad)"/>
            <path d="M 4,4 L 32,4 C 50,4 62,12 62,28 C 62,40 54,48 44,51 L 64,82 L 46,82 L 28,53 L 18,53 L 18,82 L 4,82 Z M 18,16 L 18,41 L 32,41 C 42,41 48,35 48,28 C 48,21 42,16 32,16 Z" stroke="url(#rBevelGrad)" stroke-width="1.2"/>
            
            <!-- Tilted Golden Orbital Ring -->
            <g transform="rotate(-24 38 30)">
              <ellipse cx="38" cy="30" rx="36" ry="11" fill="none" stroke="url(#rOrbitGold)" stroke-width="1.4" filter="url(#rGlow)"/>
              <!-- Orbiting Celestial Pearl -->
              <circle cx="70" cy="28" r="3.2" fill="#ffffff" filter="url(#rGlow)"/>

          </svg>

        <!-- Remaining Serif Letters -->
        <h1 class="wordmark-text">OHITH SHEREGAR</h1>
      </div>

      <!-- Tagline -->
      <p class="tagline-text">
        <span class="tagline-silver">BUILDING INTELLIGENT SYSTEMS FOR </span><span class="tagline-violet">A BETTER TOMORROW</span>
      </p>

    </div>
  </div>

  <!-- ============================================================== -->
  <!-- MODULAR THREE.JS 3D WEBGL ENGINE & SCENE ARCHITECTURE          -->
  <!-- ============================================================== -->
  <script>
    class SpaceSceneApp {
      constructor() {
        this.container = document.body;
        this.canvas = document.getElementById('webgl-canvas');
        this.heroContent = document.getElementById('hero-container');
        this.reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        this.mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
        this.clock = new THREE.Clock();

        this.initThree();
        this.initStarField();
        this.initPlanet();
        this.initAtmosphere();
        this.initOrbitalSystem();
        this.initMoon();
        this.initPhotographicMountains();
        this.initLights();
        this.initEvents();

        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
      }

      initThree() {
        this.scene = new THREE.Scene();
        this.scene.fog = new THREE.FogExp2(0x020409, 0.03);

        this.camera = new THREE.PerspectiveCamera(
          42,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        this.camera.position.set(0, 0, 18);

        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.15;
      }

      initLights() {
        // Subtle Deep Space Ambient Light
        const ambientLight = new THREE.AmbientLight(0x081326, 1.4);
        this.scene.add(ambientLight);

        // Strong Warm Sunrise Key Light (Behind & to the Right of Planet)
        this.keyLight = new THREE.DirectionalLight(0xfef08a, 4.6);
        this.keyLight.position.set(22, 12, -8);
        this.scene.add(this.keyLight);

        // Cool Blue Rim Fill Light
        this.rimLight = new THREE.DirectionalLight(0x38bdf8, 1.8);
        this.rimLight.position.set(-18, -6, 5);
        this.scene.add(this.rimLight);
      }

      initStarField() {
        this.starLayers = [];

        // Layer 1: Distant Tiny Stars
        const starGeo1 = new THREE.BufferGeometry();
        const starCount1 = 650;
        const starPos1 = new Float32Array(starCount1 * 3);
        for (let i = 0; i < starCount1 * 3; i += 3) {
          starPos1[i] = (Math.random() - 0.5) * 80;
          starPos1[i + 1] = (Math.random() - 0.5) * 50;
          starPos1[i + 2] = -25 + (Math.random() - 0.5) * 30;
        }
        starGeo1.setAttribute('position', new THREE.BufferAttribute(starPos1, 3));
        const starMat1 = new THREE.PointsMaterial({
          size: 0.12,
          color: 0xe2e8f0,
          transparent: true,
          opacity: 0.75
        });
        const stars1 = new THREE.Points(starGeo1, starMat1);
        this.scene.add(stars1);
        this.starLayers.push({ mesh: stars1, factor: 0.015 });

        // Layer 2: Midground Twinkling Stars
        const starGeo2 = new THREE.BufferGeometry();
        const starCount2 = 200;
        const starPos2 = new Float32Array(starCount2 * 3);
        const starColors = new Float32Array(starCount2 * 3);
        const colorPalette = [
          new THREE.Color(0xffffff),
          new THREE.Color(0xfef08a),
          new THREE.Color(0x93c5fd),
          new THREE.Color(0xa5b4fc)
        ];
        for (let i = 0; i < starCount2; i++) {
          const idx = i * 3;
          starPos2[idx] = (Math.random() - 0.5) * 60;
          starPos2[idx + 1] = (Math.random() - 0.5) * 40;
          starPos2[idx + 2] = -12 + (Math.random() - 0.5) * 18;
          const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
          starColors[idx] = col.r;
          starColors[idx + 1] = col.g;
          starColors[idx + 2] = col.b;
        }
        starGeo2.setAttribute('position', new THREE.BufferAttribute(starPos2, 3));
        starGeo2.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        const starMat2 = new THREE.PointsMaterial({
          size: 0.22,
          vertexColors: true,
          transparent: true,
          opacity: 0.95
        });
        const stars2 = new THREE.Points(starGeo2, starMat2);
        this.scene.add(stars2);
        this.starLayers.push({ mesh: stars2, factor: 0.035 });
      }

      initPlanet() {
        this.planetGroup = new THREE.Group();
        // Positioned in upper right region matching reference
        this.planetGroup.position.set(7.0, 1.4, 0);
        this.scene.add(this.planetGroup);

        const radius = 4.5;
        const segments = 64;
        const planetGeo = new THREE.SphereGeometry(radius, segments, segments);

        // Load procedural Earth night lights texture
        const textureLoader = new THREE.TextureLoader();
        const earthMap = textureLoader.load('./assets/earth_night.png');
        earthMap.wrapS = THREE.RepeatWrapping;

        this.planetMat = new THREE.MeshStandardMaterial({
          map: earthMap,
          roughness: 0.85,
          metalness: 0.1,
          emissive: new THREE.Color(0xf59e0b),
          emissiveMap: earthMap,
          emissiveIntensity: 0.95
        });

        this.planetMesh = new THREE.Mesh(planetGeo, this.planetMat);
        this.planetMesh.rotation.z = THREE.MathUtils.degToRad(18);
        this.planetGroup.add(this.planetMesh);
      }

      initAtmosphere() {
        const atmoGeo = new THREE.SphereGeometry(4.68, 48, 48);
        
        // Custom Fresnel Atmosphere Shader without cartoon outline
        const atmoVertexShader = `
          varying vec3 vNormal;
          varying vec3 vViewDir;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewDir = normalize(-mvPosition.xyz);
            gl_Position = projectionMatrix * mvPosition;
          }
        `;

        const atmoFragmentShader = `
          varying vec3 vNormal;
          varying vec3 vViewDir;
          void main() {
            float fresnel = 1.0 - max(dot(vNormal, vViewDir), 0.0);
            fresnel = pow(fresnel, 3.2);
            
            // Soft blend from cool blue edge to warm sunrise gold
            vec3 coolBlue = vec3(0.22, 0.74, 0.97);
            vec3 warmGold = vec3(0.99, 0.88, 0.45);
            vec3 finalColor = mix(coolBlue, warmGold, clamp(vNormal.x * 0.75 + 0.25, 0.0, 1.0));
            
            gl_FragColor = vec4(finalColor, fresnel * 0.78);
          }
        `;

        const atmoMat = new THREE.ShaderMaterial({
          vertexShader: atmoVertexShader,
          fragmentShader: atmoFragmentShader,
          blending: THREE.AdditiveBlending,
          side: THREE.BackSide,
          transparent: true,
          depthWrite: false
        });

        this.atmosphereMesh = new THREE.Mesh(atmoGeo, atmoMat);
        this.planetGroup.add(this.atmosphereMesh);
      }

      initOrbitalSystem() {
        this.orbitGroup = new THREE.Group();
        this.orbitGroup.rotation.x = THREE.MathUtils.degToRad(68);
        this.orbitGroup.rotation.y = THREE.MathUtils.degToRad(-24);
        this.planetGroup.add(this.orbitGroup);

        // Thin, elegant golden metallic 3D orbit
        const ringRadius = 7.2;
        const ringTube = 0.016;
        const ringGeo = new THREE.TorusGeometry(ringRadius, ringTube, 16, 140);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xf59e0b,
          transparent: true,
          opacity: 0.85
        });
        const orbitRing = new THREE.Mesh(ringGeo, ringMat);
        this.orbitGroup.add(orbitRing);

        // Luminous traveling satellite pearl
        const satGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const satMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        this.satellite = new THREE.Mesh(satGeo, satMat);
        this.orbitGroup.add(this.satellite);

        this.orbitAngle = 0;
        this.orbitRadius = ringRadius;
      }

      initMoon() {
        // Companion Moon in Orbit
        const moonRadius = 0.40;
        const moonGeo = new THREE.SphereGeometry(moonRadius, 32, 32);
        const moonMat = new THREE.MeshStandardMaterial({
          color: 0xcbd5e1,
          roughness: 0.9,
          metalness: 0.05
        });
        this.moonMesh = new THREE.Mesh(moonGeo, moonMat);
        this.moonMesh.position.set(4.2, 3.6, 1.0);
        this.planetGroup.add(this.moonMesh);
      }

      initPhotographicMountains() {
        // Textured Photographic Mountain Planes with Alpha Transparency
        const textureLoader = new THREE.TextureLoader();
        const mountainTex = textureLoader.load('./assets/mountains.png');

        const planeWidth = 38;
        const planeHeight = 14.4;
        const planeGeo = new THREE.PlaneGeometry(planeWidth, planeHeight);
        
        const planeMat = new THREE.MeshBasicMaterial({
          map: mountainTex,
          transparent: true,
          opacity: 0.98,
          depthWrite: false
        });

        this.mountainMesh = new THREE.Mesh(planeGeo, planeMat);
        // Anchor to bottom of perspective viewport
        this.mountainMesh.position.set(0, -3.8, 4.5);
        this.scene.add(this.mountainMesh);
      }

      initEvents() {
        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        window.addEventListener('mousemove', (e) => {
          this.mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
          this.mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length > 0) {
            this.mouse.targetX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
            this.mouse.targetY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
          }
        }, { passive: true });
      }

      animate() {
        requestAnimationFrame(this.animate);

        const delta = this.clock.getDelta();
        const elapsedTime = this.clock.getElapsedTime();

        // Smooth mouse damping
        this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.045;
        this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.045;

        // 1. Slow, Cinematic Planet Rotation (~60s per full rotation)
        if (!this.reducedMotion) {
          this.planetMesh.rotation.y += delta * 0.104;
          
          // Satellite pearl motion along orbit
          this.orbitAngle += delta * 0.40;
          this.satellite.position.x = Math.cos(this.orbitAngle) * this.orbitRadius;
          this.satellite.position.y = Math.sin(this.orbitAngle) * this.orbitRadius;

          // Moon slow orbital drift
          this.moonMesh.position.x = 4.2 + Math.sin(elapsedTime * 0.12) * 0.35;
          this.moonMesh.position.y = 3.6 + Math.cos(elapsedTime * 0.12) * 0.25;
        }

        // 2. Interactive Parallax Controller
        this.camera.position.x = this.mouse.x * 0.35;
        this.camera.position.y = this.mouse.y * 0.25;
        this.camera.lookAt(0, 0, 0);

        // Planet parallax
        this.planetGroup.position.x = 7.0 + this.mouse.x * 0.30;
        this.planetGroup.position.y = 1.4 + this.mouse.y * 0.20;

        // Photographic Mountain parallax
        if (this.mountainMesh) {
          this.mountainMesh.position.x = -this.mouse.x * 0.55;
          this.mountainMesh.position.y = -3.8 - this.mouse.y * 0.20;
        }

        // Stars parallax
        this.starLayers.forEach(layer => {
          layer.mesh.position.x = -this.mouse.x * layer.factor * 12;
          layer.mesh.position.y = -this.mouse.y * layer.factor * 8;
        });

        // 3D Typography tilt
        if (this.heroContent) {
          const tiltX = -this.mouse.y * 3.5;
          const tiltY = this.mouse.x * 3.5;
          this.heroContent.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translate3d(${this.mouse.x * 6}px, ${-this.mouse.y * 4}px, 0)`;
        }

        this.renderer.render(this.scene, this.camera);
      }
    }

    // Launch Application
    window.addEventListener('DOMContentLoaded', () => {
      new SpaceSceneApp();
    });
  </script>
</body>
</html>
